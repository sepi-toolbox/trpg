name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: 타입체크 · 테스트 · 빌드
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 규칙 엔진 테스트
        run: npm test

      - name: 프로덕션 빌드
        run: npm run build

      - name: 빌드 산출물 업로드
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
